name: Motor Speed FMU CI

on:
  push:
  workflow_dispatch:

jobs:
  run-motor-speed:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install fmpy numpy pandas matplotlib

      - name: List files (debug)
        run: |
          echo "Repo root:"
          dir
          echo "Motor_Speed folder:"
          dir Motor_Speed

      - name: Run motor simulation (generate CSV)
        run: |
          python Motor_Speed/Run_motor_speed_fmu.py

      - name: Plot results (generate PNG)
        run: |
          python Motor_Speed/plot.py

      - name: Upload artifacts (CSV + PNG)
        uses: actions/upload-artifact@v4
        with:
          name: motor-speed-results
          path: |
            Motor_Speed/*.csv
            Motor_Speed/*.png
