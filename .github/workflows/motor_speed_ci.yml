name: Motor FMU CI

on:
  push:
  workflow_dispatch:

jobs:
  run-motor:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install fmpy numpy pandas matplotlib

      - name: Run motor simulation (CSV)
        run: |
          python motor_fmu/run_motor.py

      - name: Plot motor response (PNG)
        run: |
          python motor_fmu/plot_motor.py

      - name: Upload artifacts (CSV + PNG)
        uses: actions/upload-artifact@v4
        with:
          name: motor-results
          path: |
            motor_fmu/*.csv
            motor_fmu/*.png
