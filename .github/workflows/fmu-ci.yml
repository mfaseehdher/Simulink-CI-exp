name: FMU CI

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fmpy numpy pandas matplotlib

      - name: Run parameterization (generate CSVs)
        run: |
          python cruise_control_fmu/parameterization.py

      - name: Run plot (generate PNG)
        run: |
          python cruise_control_fmu/plot.py

      - name: Upload artifacts (CSV + PNG)
        uses: actions/upload-artifact@v4
        with:
          name: fmu-results
          path: |
            cruise_control_fmu/*.csv
            cruise_control_fmu/*.png
