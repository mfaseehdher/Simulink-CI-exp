name: FMU CI

on:
  push:
  workflow_dispatch:

jobs:
  run-fmu:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FMU parameterization (generate CSVs)
        run: |
          python cruise_control_fmu/parameterization.py

      - name: Generate combined plot (save PNG)
        run: |
          python cruise_control_fmu/plot.py

      - name: Upload results (CSVs + PNG)
        uses: actions/upload-artifact@v4
        with:
          name: fmu-results
          path: |
            cruise_control_fmu/*.csv
            cruise_control_fmu/*.png
