name: FMU CI

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Install Python dependencies (NO requirements.txt)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fmpy numpy pandas matplotlib

      # 4️⃣ Run FMU parameterization (generate CSV files)
      - name: Run FMU parameterization
        run: |
          python parameterization.py

      # 5️⃣ Generate combined plot
      - name: Generate combined plot
        run: |
          python plot.py
